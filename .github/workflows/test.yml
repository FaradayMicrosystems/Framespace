name: Emulated headset test
# Runs the app in a simulated Quest 3 (Meta IWER) in headless Chromium.
# Cost: ~2-3 Linux minutes per run (free on public repos).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-screenshot
          path: test-results/
          retention-days: 3
