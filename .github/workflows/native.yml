name: Native Quest APK
# Builds the native Quest 3 app (native/) with Godot, runs its headless self-test,
# checks the APK manifest (boundaryless + passthrough), and uploads the APK.
# On main it also refreshes the "native-latest" release so there is one stable download link.
# Cost: ~6-10 Linux minutes per run (free on public repos).
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.6.2
  VENDORS_VERSION: 5.0.0-stable
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot + export templates + Meta plugin
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-vendors-${{ env.VENDORS_VERSION }}

      - name: Download Godot, Android templates and Meta OpenXR plugin
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache && cd ~/godot-cache
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLf -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && rm godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSLf -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          # Only the Android pieces are needed.
          unzip -q templates.tpz 'templates/android_*' 'templates/version.txt' && rm templates.tpz
          curl -sSLf -o vendors.zip https://github.com/GodotVR/godot_openxr_vendors/releases/download/${VENDORS_VERSION}/godotopenxrvendorsaddon.zip
          unzip -q vendors.zip 'asset/addons/*' && rm vendors.zip

      - name: Install templates and plugin
        run: |
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $tdir && cp -r ~/godot-cache/templates/* $tdir/
          mkdir -p native/addons && cp -r ~/godot-cache/asset/addons/godotopenxrvendors native/addons/
          for v in 4 4.6; do
            mkdir -p ~/.config/godot
            cat > ~/.config/godot/editor_settings-$v.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      - name: Import project
        run: ~/godot-cache/godot --headless --path native --import 2>&1 | tee import.log; true

      - name: Self-test (headless, no headset)
        run: |
          set -o pipefail
          timeout 120 ~/godot-cache/godot --headless --path native -- --selftest 2>&1 | tee selftest.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" selftest.log import.log; then echo "::error::GDScript errors"; exit 1; fi

      - name: Build APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/native/framespace-sideload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: framespace
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: framespace-sideload
        run: |
          mkdir -p native/build
          ~/godot-cache/godot --headless --path native --install-android-build-template --export-release "Quest 3" build/framespace.apk 2>&1 | tee export.log
          test -f native/build/framespace.apk || { echo "::error::APK was not produced"; exit 1; }
          ls -la native/build

      - name: Check manifest (boundaryless, passthrough, anchors, scene)
        run: |
          aapt2=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -1)aapt2
          $aapt2 dump xmltree --file AndroidManifest.xml native/build/framespace.apk > manifest.txt
          grep -E 'oculus|horizonos|permission|uses-feature' -A2 manifest.txt | grep -E 'name|required' | sed 's/^ *//' | sort -u
          for need in com.oculus.feature.BOUNDARYLESS_APP com.oculus.feature.PASSTHROUGH com.oculus.permission.USE_ANCHOR_API com.oculus.permission.USE_SCENE; do
            grep -q "$need" manifest.txt || { echo "::error::Manifest is missing $need"; exit 1; }
          done
          echo "Manifest OK"

      - uses: actions/upload-artifact@v4
        with:
          name: framespace-quest-apk
          path: native/build/framespace.apk
          retention-days: 30

      - name: Publish "native-latest" release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete native-latest --yes --cleanup-tag || true
          gh release create native-latest native/build/framespace.apk \
            --title "Framespace for Quest 3 (latest build)" --prerelease \
            --notes "Sideload this APK onto a Quest 3 (developer mode). Built from ${GITHUB_SHA::7}. See native/README.md for steps."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-logs
          path: |
            import.log
            selftest.log
            export.log
            manifest.txt
          retention-days: 7
